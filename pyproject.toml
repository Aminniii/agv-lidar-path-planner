[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agv-lidar-path-planner"
version = "0.9.2"
description = "Offline LiDAR map path planning and optional ROS 2/Nav2 mecanum AGV integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=9", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest-cov>=5", "pytest>=7", "ruff>=0.6"]

[project.scripts]
agv-path-planner = "agv_planner.planner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.package-data]
"agv_planner.config" = ["*.yaml"]

[tool.coverage.run]
source = ["agv_planner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
